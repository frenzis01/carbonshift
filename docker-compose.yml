services:
  carbonshift:
    build: ./rust
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      SELF_BASE_URL: http://carbonshift:8080
      EXECUTOR_URL: http://executor:9000/dispatch
      CARBONSHIFT_ALLOW_PRIVATE_CALLBACKS: "1"
      CARBONSHIFT_API_KEY: "${CARBONSHIFT_API_KEY:-}"
      TOTAL_SLOTS: "${TOTAL_SLOTS:-8640}"
      SLOT_DURATION_SECONDS: "${SLOT_DURATION_SECONDS:-3600}"
      MANUAL_CLOCK: "${MANUAL_CLOCK:-1}"
      DISPATCHER_POLL_INTERVAL_MS: "${DISPATCHER_POLL_INTERVAL_MS:-200}"
      # Lower this (e.g. 0.3) when MANUAL_CLOCK=1: submissions routinely
      # aren't scheduled within the default 5s poll in emulation mode, so
      # every /v1/requests call would otherwise block for the full timeout.
      SUBMIT_WAIT_TIMEOUT_SECS: "${SUBMIT_WAIT_TIMEOUT_SECS:-0.3}"
    # map container /tmp folder to host ./carbonshift_tmp for storage
    volumes:
      - carbonshift_tmp:/tmp
    depends_on:
      - executor
      - provider

  executor:
    build: ./services/executor
    ports:
      - "9000:9000"
    environment:
      EXECUTOR_MANUAL_CLOCK: "${MANUAL_CLOCK:-1}"
      EXECUTOR_SLOT_MINUTES: "${EXECUTOR_SLOT_MINUTES:-60}"
      # Shadow Accurate-flavour pass per request, for empirical baseline
      # execution time + model-vs-model quality_score (see executor/README.md).
      EXECUTOR_COMPUTE_QUALITY_BASELINE: "${EXECUTOR_COMPUTE_QUALITY_BASELINE:-1}"
    volumes:
      # Persists downloaded model weights across container restarts/rebuilds.
      - hf-cache:/root/.cache/huggingface

  client:
    build: ./services/client
    ports:
      - "8100:8100"
    environment:
      CARBONSHIFT_URL: http://carbonshift:8080
      CARBONSHIFT_API_KEY: "${CARBONSHIFT_API_KEY:-}"
      CLIENT_SELF_BASE_URL: http://client:8100
      PROVIDER_URL: http://provider:9100
      PROVIDER_SLOT_MINUTES: "${PROVIDER_SLOT_MINUTES:-60}"
      CLIENT_CALLBACK_TIMEOUT_SECONDS: 6000
      CLIENT_QOS_PROFILE_VERSION: "${CLIENT_QOS_PROFILE_VERSION:-v1}"
      CLIENT_QOS_PROFILE_THRESHOLD_POSITION: "${CLIENT_QOS_PROFILE_THRESHOLD_POSITION:-0.75}"
      CLIENT_QOS_PROFILE_DEFINITIONS_PATH: "${CLIENT_QOS_PROFILE_DEFINITIONS_PATH:-}"
      CLIENT_QOS_PROFILE_REGISTRATION_ATTEMPTS: "${CLIENT_QOS_PROFILE_REGISTRATION_ATTEMPTS:-10}"
      CLIENT_QOS_PROFILE_REGISTRATION_RETRY_SECONDS: "${CLIENT_QOS_PROFILE_REGISTRATION_RETRY_SECONDS:-2.0}"
    depends_on:
      - carbonshift
      - provider

  client-2:
    build: ./services/client
    profiles: ["multi-client"]
    ports:
      - "8101:8100"
    environment:
      CARBONSHIFT_URL: http://carbonshift:8080
      CARBONSHIFT_API_KEY: "${CARBONSHIFT_API_KEY:-}"
      CLIENT_SELF_BASE_URL: http://client-2:8100
      CLIENT_METRICS_PATH: data/metrics-client-2.jsonl
      PROVIDER_URL: http://provider:9100
      PROVIDER_SLOT_MINUTES: "${PROVIDER_SLOT_MINUTES:-60}"
      CLIENT_CALLBACK_TIMEOUT_SECONDS: 6000
      CLIENT_QOS_PROFILE_VERSION: "${CLIENT_QOS_PROFILE_VERSION:-v1}"
      CLIENT_QOS_PROFILE_THRESHOLD_POSITION: "${CLIENT_QOS_PROFILE_THRESHOLD_POSITION:-0.75}"
      CLIENT_QOS_PROFILE_DEFINITIONS_PATH: "${CLIENT_QOS_PROFILE_DEFINITIONS_PATH:-}"
      CLIENT_QOS_PROFILE_REGISTRATION_ATTEMPTS: "${CLIENT_QOS_PROFILE_REGISTRATION_ATTEMPTS:-10}"
      CLIENT_QOS_PROFILE_REGISTRATION_RETRY_SECONDS: "${CLIENT_QOS_PROFILE_REGISTRATION_RETRY_SECONDS:-2.0}"
    depends_on:
      - carbonshift
      - provider

  provider:
    build: ./services/provider
    ports:
      - "9100:9100"
    environment:
      PROVIDER_HOST: 0.0.0.0
      PROVIDER_PORT: 9100
      PROVIDER_ROLE: "${PROVIDER_ROLE:-local}"
      PROVIDER_SLOT_MINUTES: "${PROVIDER_SLOT_MINUTES:-60}"
      PROVIDER_MANUAL_CLOCK: "${MANUAL_CLOCK:-1}"
      PROVIDER_NOTIFY_TIMEOUT_SECONDS: "${PROVIDER_NOTIFY_TIMEOUT_SECONDS:-180}"
      CARBONSHIFT_URL: http://carbonshift:8080
      CLIENT_URL: http://client:8100
      PROVIDER_CLIENT_URLS: "${PROVIDER_CLIENT_URLS:-}"
      EXECUTOR_URL: http://executor:9000
      PROVIDER_SELF_BASE_URL: http://provider:9100
    # depends_on: 
      # - carbonshift
      # - client
      # - executor

  visualizer:
    build: ./services/visualizer
    ports:
      - "8500:8500"
    environment:
      VISUALIZER_HOST: 0.0.0.0
      VISUALIZER_PORT: 8500
      CARBONSHIFT_URL: http://carbonshift:8080
      CARBONSHIFT_API_KEY: "${CARBONSHIFT_API_KEY:-}"
      PROVIDER_URL: http://provider:9100
    depends_on:
      - carbonshift
      - client

  # One-off runners for fake-time emulation (see client/README.md
  # §"Emulazione a tempo fittizio"). Not started by `docker compose up`
  # (profile-gated); run explicitly once the stack above is up. The
  # multi-client runner uses the `multi-client` profile and client-2:
  #   MANUAL_CLOCK=1 SUBMIT_WAIT_TIMEOUT_SECS=0.3 docker compose up -d --build
  #   docker compose run --rm emulation --slots 4 --per-slot 3 --slot-minutes 30
  emulation:
    build: ./services/client
    profiles: ["emulation"]
    healthcheck:
      disable: true
    depends_on:
      - client
      - provider
    environment:
      CARBONSHIFT_URL: http://carbonshift:8080
      CARBONSHIFT_API_KEY: "${CARBONSHIFT_API_KEY:-}"
      CLIENT_SELF_BASE_URL: http://client:8100
      PROVIDER_URL: http://provider:9100
      CLIENT_QOS_PROFILE_VERSION: "${CLIENT_QOS_PROFILE_VERSION:-v1}"
      CLIENT_QOS_PROFILE_THRESHOLD_POSITION: "${CLIENT_QOS_PROFILE_THRESHOLD_POSITION:-0.75}"
      CLIENT_QOS_PROFILE_DEFINITIONS_PATH: "${CLIENT_QOS_PROFILE_DEFINITIONS_PATH:-}"
    entrypoint:
      - python3
      - scripts/run_emulation.py
      - --client-url
      - http://client:8100
      - --executor-url
      - http://executor:9000
      - --provider-url
      - http://provider:9100

  emulation-multi:
    build: ./services/client
    profiles: ["multi-client"]
    healthcheck:
      disable: true
    depends_on:
      - client
      - client-2
      - provider
    environment:
      CARBONSHIFT_URL: http://carbonshift:8080
      CARBONSHIFT_API_KEY: "${CARBONSHIFT_API_KEY:-}"
      CLIENT_SELF_BASE_URL: http://client:8100
      PROVIDER_URL: http://provider:9100
      CLIENT_QOS_PROFILE_VERSION: "${CLIENT_QOS_PROFILE_VERSION:-v1}"
      CLIENT_QOS_PROFILE_THRESHOLD_POSITION: "${CLIENT_QOS_PROFILE_THRESHOLD_POSITION:-0.75}"
      CLIENT_QOS_PROFILE_DEFINITIONS_PATH: "${CLIENT_QOS_PROFILE_DEFINITIONS_PATH:-}"
    entrypoint:
      - python3
      - scripts/run_emulation_multi.py
      - --client-url
      - http://client:8100
      - --client-url
      - http://client-2:8100
      - --task
      - ner
      - --task
      - question_answering
      - --executor-url
      - http://executor:9000
      - --provider-url
      - http://provider:9100

volumes:
  hf-cache:
  carbonshift_tmp:
